# extractor.alchemydev.io — standalone full-parity email-extractor.
#
# Install on the VPS as /etc/nginx/sites-available/extractor.alchemydev.io,
# symlink into sites-enabled/, then run:
#   nginx -t && systemctl reload nginx
#   certbot --nginx -d extractor.alchemydev.io       # adds TLS + HTTP->HTTPS (managed)
# This is ADD-ONLY: it touches no other server block. Routing:
#   /api/auth/*  -> Next/BetterAuth (frontend)   signup/login/session
#   /api/v1/*    -> FastAPI backend              discovery/enrichment/verify/webhook
#   /*           -> Next frontend                UI
# Cookies forward on every proxy_pass so the backend can validate the session.
server {
    listen 80;
    listen [::]:80;
    server_name extractor.alchemydev.io;

    client_max_body_size 10m;

    location /api/auth/ {
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /api/v1/ {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s; # scans/verification can run long
    }

    location / {
        proxy_pass http://127.0.0.1:3011;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
